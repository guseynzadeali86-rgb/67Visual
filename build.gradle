plugins {
    id 'fabric-loom' version '1.9.2'
}

version = '1.0.0'
group = 'com.beevisual'

base {
    archivesName = 'beevisual-ui'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.113.0+1.21.4'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Copy the GUI assets from the project root into the resources folder
// (they are named 01_..., 02_... in the root, the mod expects clean names).
def assetRenames = [
    '01_background.png'        : 'background.png',
    '02_logo.png'              : 'logo.png',
    '03_button_normal.png'     : 'button_normal.png',
    '03_button_hover.png'      : 'button_hover.png',
    '03_button_disabled.png'   : 'button_disabled.png',
    '04_button_singleplayer.png'        : 'button_singleplayer.png',
    '04_button_singleplayer_hover.png'  : 'button_singleplayer_hover.png',
    '04_button_multiplayer.png'         : 'button_multiplayer.png',
    '04_button_multiplayer_hover.png'   : 'button_multiplayer_hover.png',
    '04_button_options.png'             : 'button_options.png',
    '04_button_options_hover.png'       : 'button_options_hover.png',
    '04_button_quit.png'                : 'button_quit.png',
    '04_button_quit_hover.png'          : 'button_quit_hover.png',
    '05_icon_language.png'              : 'icon_language.png',
    '05_icon_language_hover.png'        : 'icon_language_hover.png',
    '05_icon_accessibility.png'         : 'icon_accessibility.png',
    '05_icon_accessibility_hover.png'   : 'icon_accessibility_hover.png',
    '06_traffic_close.png'              : 'traffic_close.png',
    '06_traffic_minimize.png'           : 'traffic_minimize.png',
    '06_traffic_zoom.png'               : 'traffic_zoom.png',
    '07_text_field.png'                 : 'text_field.png',
    '07_text_field_focus.png'           : 'text_field_focus.png',
    '08_slider.png'                     : 'slider.png',
    '08_slider_hover.png'               : 'slider_hover.png'
]

tasks.register('copyAssets', Copy) {
    from rootProject.projectDir
    include assetRenames.keySet()
    into layout.projectDirectory.dir('src/main/resources/assets/beevisual/textures/gui')
    eachFile { details ->
        def target = assetRenames[details.name]
        if (target != null) {
            details.name = target
        }
    }
    doLast {
        println 'Copied GUI assets to src/main/resources/assets/beevisual/textures/gui'
    }
}

processResources.dependsOn copyAssets

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaExec).configureEach {
    // avoids the "unknown invokedynamic bsm" noise from the Loom agent
    jvmArgs '-XX:+IgnoreUnrecognizedVMOptions'
}